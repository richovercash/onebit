plugins { id 'java-library' }

dependencies {
    api 'org.jmrtd:jmrtd:0.7.42'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    testImplementation 'junit:junit:4.13.2'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) } // only full JDK on this box
}
tasks.withType(JavaCompile).configureEach { options.release = 11 }
tasks.named('compileTestJava') { options.release = 17 } // tests are JVM-only

tasks.register('sodSizes', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'onebit.core.SodSizes'
}

tasks.register('cmsProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'onebit.core.CmsProbe'
}

tasks.register('enrollProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'onebit.core.EnrollProbe'
    systemProperty 'out', project.rootDir.path + '/circuits/enroll/Prover.toml'
}

tasks.register('chainProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'onebit.core.ChainProbe'
    systemProperty 'dir', '/tmp/scratch/87e4e139-9e18-4bab-9d49-4cfade790afc/scratchpad'
}

tasks.register('spkiCheck', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'onebit.core.SpkiCheck'
    args project.rootDir.path + '/app/src/main/assets/masterlist/masterlist.pem',
        project.rootDir.path + '/app/src/main/assets/zk/cscatree_rsa4096.json'
}

tasks.register('ecdsaProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'onebit.core.EcdsaProbe'
    systemProperty 'dir', project.rootDir.path + '/circuits/enroll_ecdsa'
}
