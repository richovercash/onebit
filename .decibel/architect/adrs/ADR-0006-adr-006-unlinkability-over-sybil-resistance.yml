id: ADR-0006
scope: project
project: onebit
title: "ADR-006: Unlinkability over Sybil resistance — no document-derived nullifier, not even opt-in"
status: accepted
created_at: 2026-10-10T07:00:00.000Z
updated_at: 2026-10-10T07:00:00.000Z
context: "The 2026-10 review confirmed self-review F2: the nullifier key k is a free witness, so a holder running a modified prover can mint unlimited nullifiers from one document and open many accounts at one verifier. The SPEC 4.1 remedy (prove k consistent with the enrolled commitment C) does not close this, because k is freshly sampled at enrollment and the holder can simply re-enroll. The only in-circuit fix is a k derived deterministically from document data (e.g. Poseidon2 of the DSC signature over the SOD), as zkPassport does. But anyone who has ever read the chip (border control, hotel and rental scanners, employers, a partner, a thief) could then recompute k and, joined with any verifier's records (breach, subpoena, data sale), prove that this person holds an account there. For the sites that need an age gate (adult content, gambling, dating, sexual-health and LGBTQ communities) that is outing and blackmail material. It would be permanent (a passport lasts about ten years and k cannot rotate) and invisible to the holder. Even then it would not give one-account-per-person, because the epoch rotates hourly; that would also need a stable registration scope."
decision: "The nullifier key k stays random, freshly sampled, and SE-sealed on the device. No circuit, wallet or policy flag may derive a nullifier or any transmitted value from document data, and no verifier policy can request it: there is no opt-in 'Sybil mode', because a holder pressured into consenting is still harmed, and a market option becomes a market default. Multi-account control is the verifier's responsibility, using its own signals (account rate limits, payment, phone, behaviour, its own fraud tooling). OneBit's per-(verifier, epoch) nullifier and device attestation are a speed bump, not a guarantee."
consequences: "V2 holds unconditionally. The circuit-level gap F2 is accepted by design, not a pending fix. The open issue 'nullifier key k unconstrained' is closed as accepted. SPEC 4.1 and the threat table now say that the nullifier bounds an honest wallet, not a modified prover, and SECURITY.md lists multi-account use by a genuine document holder as out of scope. The age claim itself stays sound: every account is still backed by a real adult document, so the age harm that remains is an adult supplying accounts to minors, which the verifier must police like any other account resale. Revisit only if a construction gives per-document uniqueness that no chip-reader can recompute (e.g. a chip-held secret usable inside ZK), and never as an option that weakens V2."
related_epics: '["EPIC-0002"]'
