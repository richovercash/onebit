id: ADR-0003
scope: project
project: onebit
title: "ADR-003: Proving architecture — Option B (split + recursion, Noir/UltraHonk)"
status: accepted
created_at: 2026-07-12T01:30:45.475Z
updated_at: 2026-07-12T01:30:45.475Z
context: "SPEC §4.2 defines a decision gate: Option A (one monolithic circuit per presentation, target Longfellow-ZK) if monolithic proving is ≤2.5s p50 / ≤6s p95 on a reference low-end device; else Option B (Circuit E once at enrollment producing cached π_E, Circuit P per presentation verifying π_E in-circuit; target Noir/UltraHonk). T2 benchmark executed 2026-07-11; full data in bench/RESULTS.md."
decision: "Option B: split + recursion on Noir/UltraHonk (barretenberg), forking zkPassport's Apache-2.0 passive-auth circuits. Two independent grounds. (1) Speed: a weight-faithful monolithic analog (SHA-256 over DG1+eContent+DSC, real RSA-2048 PKCS#1v1.5 verify, depth-20 Poseidon Merkle, date predicates, nullifier) is 177,350 UltraHonk gates and proves at 1.13s p50 on an i9-13900KF/32T; scaled to Pixel 6 (~7×) that is ~7-9s and to a true low-end device ~15s+ — failing the gate 3-6× over, while the analog still undercounts real Option A (no X.509/TBS parsing, no PSS, single signature). (2) Coverage: google/longfellow-zk contains no RSA circuits (lib/circuits: ecdsa, sha, mdoc, cbor only), and RSA DSCs sign the large majority of ICAO SODs — Option A's target system cannot express most real documents at any speed. Supporting: Option B's presentation core is 3,026 gates (0.15s desktop, sub-second on phone); enrollment-side circuits (zkPassport dsc_rsa_4096: 248k gates, id_data_rsa_2048: 108k gates) run once and are cached, matching zkPassport's shipping profile of 10-50s enrollment / 1-10s disclosure on phones."
consequences: "Presentation-time cost concentrates in the in-circuit verification of π_E (UltraHonk recursion); zkPassport's 4-proof aggregator is 3.3M gates, our single-verify Circuit P will be materially smaller but must be measured natively on Pixel 6/9 once built (remaining T2 validation, folds into T4/T5). Enrollment gains a one-time 10-50s proving step with progress UX (V6: degrade loudly). Proof size drops from Longfellow's 100s-of-KB Ligero proofs to UltraHonk KB-scale. We inherit Noir/barretenberg toolchain pinning (Noir 1.0.0-beta.20, bb 4.2.0) and an Aztec universal-setup dependency (SRS ~128MB bundled). C never leaves the device: π_E is a private input to Circuit P, per SPEC. Raw DG bytes must be retained encrypted on-device only until π_E is generated, then destroyed (per §3.1 step 5, Option-B branch)."
