id: ADR-0005
scope: project
project: onebit
title: "ADR-005: CSCA→DSC trust is verified at enrollment, not per presentation"
status: accepted
created_at: 2026-07-19T03:37:26.953Z
updated_at: 2026-07-19T03:37:26.953Z
context: "The presentation circuit mono_faithful proves DSC→SOD (real ICAO CMS passive auth) in ZK, but the DSC→CSCA link (proving the DSC is signed by a CSCA in the published master list) was synthetic (dsc_root ignored by the verifier). Making it real requires verifying CSCA→DSC. Survey of the bundled 588-CSCA master list: 357 RSA-4096, 164 ECDSA (various curves), 60 RSA-3072, 6 RSA-6144, 1 RSA-2048. CSCA keys are large (majority 4096) and algorithm-diverse, unlike the RSA-2048 DSCs. Verifying CSCA→DSC in the presentation circuit would add an RSA-4096+ or ECDSA verification per presentation (~145-160k gates total, ~7-9s native, over the 5s budget) AND require a circuit variant per CSCA key type. Confirmed bb.js poseidon2Hash is byte-identical to the circuit's Poseidon2::hash, so a real master-list Merkle tree is buildable and will agree with an in-circuit fold."
decision: "The CSCA→DSC trust check is established ONCE at enrollment, never per presentation. The CSCA→DSC link is fixed per document, so verifying it every age check is wasteful and busts the budget. Target design (option C): an enrollment circuit verifies that a CSCA in the master-list Merkle tree signed the DSC (10-50s at enrollment is acceptable) and emits a device-bound DSC-trust credential; presentation stays mono_faithful (DSC→SOD→predicate→nullifier, ~4.5s), with presentation-time trust resting on the SE/attestation binding of that credential to the device. Interim (option D, current shipping state): mono_faithful proves DSC→SOD in ZK; the CSCA→DSC link is verified by the attested wallet's Java passive auth out-of-circuit. Rejected: (A) full CSCA→DSC→SOD monolithic per presentation — ~7-9s, over budget, needs key-type variant matrix; (B) Circuit E/P recursion at presentation — ~775k gates / ~30s+ native, worse than A. The master-list Merkle tree is built with the poseidon2-matched builder (bb.js) and consumed at enrollment."
consequences: "Presentation stays under budget (~4.5s) with the DSC→SOD half fully in ZK. The synthetic dsc_root in mono_faithful remains labeled until the enrollment circuit lands — it is not a soundness hole in the DSC→SOD proof, only un-anchored CSCA membership. The enrollment circuit must handle the CSCA key-type diversity (RSA-3072/4096/6144 + ECDSA curves) — the P1.1 coverage-variant work now applies primarily to the CSCA layer at enrollment, not the DSC layer at presentation. This draws the enrollment/presentation split at the CSCA boundary (expensive, once) vs DSC→SOD (cheap, per-presentation), refining SPEC Option B with concrete master-list data. Current envelope binding=document is honest: ZK covers DSC→SOD, attestation covers CSCA→DSC until the enrollment circuit is built."
