id: ADR-0004
scope: project
project: onebit
title: "ADR-004: Amend ADR-003 — monolithic presentation for single-signature credential; recursion reserved for multi-credential"
status: accepted
created_at: 2026-07-18T06:48:29.995Z
updated_at: 2026-07-18T06:48:29.995Z
context: "ADR-003 chose Option B (enrollment/presentation split with in-circuit recursion) over Option A (monolithic per-presentation) on the assumption that verifying a cached enrollment proof would be cheaper than redoing the RSA signature check each presentation. That assumption was never measured on-device because Circuit E/P recursion did not exist at T2. This session built the full recursion (Circuit P v1 verifies pi_E via verify_proof_with_type) and measured both approaches on a Pixel 6 Pro (single-threaded WASM): recursion (775,800 gates) ~93s/proof; monolithic Option A analog (177,350 gates) ~29s/proof. Additionally discovered a structural tension: WASM multi-threading in the wallet WebView needs crossOriginIsolated (COOP/COEP), whose reliable delivery needs an in-app HTTP server, which needs the INTERNET permission the wallet deliberately lacks (invariant V1). shouldInterceptRequest headers do not reliably enable cross-origin isolation."
decision: "Amend ADR-003. For the current single-DSC-signature credential, use MONOLITHIC presentation (Option A): the per-presentation proof does the RSA/SHA/Merkle/predicate/nullifier in one circuit, no recursion. It is ~3.2x faster on real hardware because the UltraHonk recursive verifier (~770k gates of fixed overhead) costs more than the 177k-gate RSA check it was meant to amortize away. Recursion is not deleted: Circuit E + Circuit P v1 stay in the tree, correct and tested, and become the design for the MULTI-credential future (mDL + passport aggregation, P3.1) where one recursion amortizes many signatures — the case where zkPassport's split pays off. Separately, adopt NATIVE proving (barretenberg via JNI/NDK) as the performance path that respects V1: native multi-threaded proving needs no SharedArrayBuffer, no crossOriginIsolated, no socket, no INTERNET permission, and is faster per-core than WASM. The WebView WASM prover remains the fallback/reference."
consequences: Presentation architecture reverts toward Option A for P0/single-credential; the T5 demo's WebView prover should be repointed at the monolithic circuit. A native-proving spike (NDK barretenberg build + JNI bindings + bundled .so) becomes the top P1.0 performance item; projected ~4-8s monolithic native multi-threaded on P6 vs ~29s single-threaded WASM, approaching the <5s budget without recursion and without network. The credential-binding correctness proven by Circuit P v1 is preserved and reused for multi-credential. V1 (zero network) is explicitly prioritized over in-WebView threading. Circuit E remains the enrollment proof for the multi-credential path. Coverage variants (RSA-PSS/ECDSA/4096) now target the monolithic circuit shape as well as Circuit E.
