name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04   # glibc >=2.38: bb runs natively, no docker shim
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: JUnit suites (core fuzz + verifier fixtures)
        run: ./gradlew :core:test :verifier:test

      - name: Install Noir (nargo 1.0.0-beta.20)
        run: |
          curl -L https://github.com/noir-lang/noir/releases/download/v1.0.0-beta.20/nargo-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin

      - name: Circuit compile smoke
        run: |
          for c in mono_faithful enroll enroll_ecdsa present_amortized enroll_rsa6144 enroll_p384 mono_faithful_ecdsa enroll_dsc_ecdsa mono_faithful_pss enroll_secp256 enroll_bp384 enroll_secp521 enroll_bp512; do
            (cd circuits/$c && nargo compile) || exit 1
          done
