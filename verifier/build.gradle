plugins {
    id 'java-library'
    id 'application'
}

dependencies {
    implementation project(':core')
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.zxing:core:3.5.3'   // QR carrier for the deep link (P1.5)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}

application { mainClass = 'onebit.verifier.Main' }

tasks.register('demoServer', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'onebit.verifier.DemoServer'
    args project.rootDir.path + '/verifier/allowlist.json'
    systemProperty 'onebit.jsdir', "${project.rootDir}/verifier/js"
    // node for the bb.js verify sidecar: PATH by default, ONEBIT_NODE to pin
    systemProperty 'onebit.node', System.getenv('ONEBIT_NODE') ?: 'node'
    systemProperty 'onebit.personbound', System.getProperty('onebit.personbound', 'false')  // -Donebit.personbound=true → strict site
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
