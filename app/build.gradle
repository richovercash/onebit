plugins { id 'com.android.application' version '8.13.2' }

android {
    namespace 'onebit.wallet'
    compileSdk 35

    defaultConfig {
        applicationId 'onebit.wallet'
        minSdk 26          // java.time without desugaring
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':core')
    implementation 'net.sf.scuba:scuba-sc-android:0.0.26' // IsoDepCardService
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1' // replaces Android's stripped BC
    testImplementation 'junit:junit:4.13.2'
}
