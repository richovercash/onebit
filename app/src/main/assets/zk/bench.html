<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script type="module">
import { Barretenberg, UltraHonkBackend, BackendType } from '/zk/bb/index.js';
import { Noir } from '/zk/noir_js/index.mjs';

async function run() {
  const t0 = Date.now();
  const circuit = await (await fetch('/zk/circuit_p_v1.json')).json();
  const inputs = await (await fetch('/zk/bench_p_inputs.json')).json();
  const noir = new Noir(circuit);
  const type = (typeof SharedArrayBuffer !== 'undefined')
      ? BackendType.WasmWorker : BackendType.Wasm;
  const api = await Barretenberg.new({ backend: type, threads: 4 });
  const backend = new UltraHonkBackend(circuit.bytecode, api);
  Android.onReady('warmup ' + (Date.now() - t0) + 'ms, backend ' + type);

  const times = [];
  let lastPub = null;
  for (let i = 0; i < 3; i++) {
    const w0 = Date.now();
    const { witness } = await noir.execute(inputs);
    const p0 = Date.now();
    const { proof, publicInputs } = await backend.generateProof(witness);
    const done = Date.now();
    lastPub = publicInputs;
    times.push({ run: i, witness_ms: p0 - w0, prove_ms: done - p0, total_ms: done - w0 });
    Android.onProgress(JSON.stringify(times[i]));
  }
  const proveMs = times.map(t => t.prove_ms).sort((a, b) => a - b);
  Android.onProof(JSON.stringify({
    backend: type, warmup_ms: 0,
    prove_p50_ms: proveMs[1], runs: times, nullifier: lastPub ? lastPub[lastPub.length - 1] : null,
  }));
}
run().catch(e => Android.onError(String((e && e.stack) || e)));
</script>
</body></html>
