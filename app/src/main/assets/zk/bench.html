<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script type="module">
import { Barretenberg, UltraHonkBackend, BackendType } from '/zk/bb/index.js';
import { Noir } from '/zk/noir_js/index.mjs';

const params = new URLSearchParams(location.search);
const circuitFile = params.get('c') || 'circuit_p_v1.json';
const inputsFile  = params.get('i') || 'bench_p_inputs.json';
const label       = params.get('l') || circuitFile;

async function run() {
  // Threading diagnostics — this is why v1 fell back to single-threaded.
  const diag = {
    label,
    crossOriginIsolated: (typeof crossOriginIsolated !== 'undefined') ? crossOriginIsolated : 'undef',
    sharedArrayBuffer: (typeof SharedArrayBuffer !== 'undefined'),
    hardwareConcurrency: navigator.hardwareConcurrency,
  };
  Android.onReady(JSON.stringify(diag));

  const t0 = Date.now();
  const circuit = await (await fetch('/zk/' + circuitFile)).json();
  const inputs = await (await fetch('/zk/' + inputsFile)).json();
  const noir = new Noir(circuit);
  const useThreads = diag.sharedArrayBuffer;
  const type = useThreads ? BackendType.WasmWorker : BackendType.Wasm;
  const threads = useThreads ? Math.min(8, diag.hardwareConcurrency || 4) : 1;
  const api = await Barretenberg.new({ backend: type, threads });
  const backend = new UltraHonkBackend(circuit.bytecode, api);
  Android.onProgress('warmup ' + (Date.now() - t0) + 'ms, backend ' + type + ', threads ' + threads);

  const times = [];
  for (let i = 0; i < 3; i++) {
    const w0 = Date.now();
    const { witness } = await noir.execute(inputs);
    const p0 = Date.now();
    await backend.generateProof(witness);
    times.push(Date.now() - p0);
    Android.onProgress('run ' + i + ': prove ' + times[i] + 'ms (witness ' + (p0 - w0) + 'ms)');
  }
  const sorted = [...times].sort((a, b) => a - b);
  Android.onProof(JSON.stringify({ label, backend: type, threads,
    prove_p50_ms: sorted[1], runs: times }));
}
run().catch(e => Android.onError(String((e && e.stack) || e)));
</script>
</body></html>
