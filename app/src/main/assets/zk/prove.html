<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script type="module">
import { Barretenberg, UltraHonkBackend, BackendType } from '/zk/bb/index.js';
import { Noir } from '/zk/noir_js/index.mjs';

let backend = null, noir = null;

async function warmup() {
  const circuit = await (await fetch('/zk/circuit_p.json')).json();
  noir = new Noir(circuit);
  const type = (typeof SharedArrayBuffer !== 'undefined')
      ? BackendType.WasmWorker : BackendType.Wasm;
  const api = await Barretenberg.new({ backend: type, threads: 4 });
  backend = new UltraHonkBackend(circuit.bytecode, api);
  Android.onReady(type);
}

window.oneBitProve = async (inputsJson) => {
  try {
    const t0 = Date.now();
    const { witness } = await noir.execute(JSON.parse(inputsJson));
    const { proof, publicInputs } = await backend.generateProof(witness);
    let b64 = '';
    const CHUNK = 8192;
    for (let i = 0; i < proof.length; i += CHUNK) {
      b64 += String.fromCharCode.apply(null, proof.subarray(i, i + CHUNK));
    }
    Android.onProof(JSON.stringify({
      ms: Date.now() - t0, proof: btoa(b64), publicInputs,
    }));
  } catch (e) {
    Android.onError(String((e && e.stack) || e));
  }
};

warmup().catch(e => Android.onError('warmup: ' + String((e && e.stack) || e)));
</script>
</body>
</html>
